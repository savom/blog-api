name: Build and Deploy

on:
    push:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
        - uses: actions/checkout@v4
        
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'

        - name: Build JAR
          run: |
            chmod +x gradlew
            ./gradlew bootJar

        - uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor}}
            password: ${{ secrets.GITHUB_TOKEN }}

        - uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ghcr.io/savom/blog-api:${{ github.sha}}

        - name: Update manifest
          run: |
            git clone https://x-access-token:${{ secrets.MANIFESTS_TOKEN }}@github.com/savom/homelab-manifests.git m
            cd m
            sed -i "s|image: ghcr.io/savom/blog-api:.*|image: ghcr.io/savom/blog-api:${{ github.sha }}|" apps/blog-api/deployment.yaml
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add .
            git commit -m "Update blog-api image to ${{ github.sha }}" || exit 0
            git push